[project]
name = "chronobio"
version = "0.1.0"
description = "ChronoBio AI Discovery Engine — evidence-traceable hypothesis generation for LabOS (isolated, opt-in)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9,<3",
    "httpx>=0.27,<1",
    "pdfplumber>=0.11,<1",
    "pypdfium2>=5,<6",
    "pillow>=11,<13",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "reportlab>=4,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chronobio"]

[tool.uv]
# Only resolve releases that have been public for at least two weeks.
exclude-newer = "2026-09-28T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
