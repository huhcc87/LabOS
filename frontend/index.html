<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>LabOS — Laboratory Operations & Research Management Platform</title>
    <link rel="canonical" href="https://lab-os.vercel.app/" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#6366f1" />
    <!-- PWA / Apple -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LabOS" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- SEO / meta
         NOTE: this is the only route Google can ever crawl. Every other page
         in the app (Dashboard, Lab Hub, Sample Hub, ...) requires a signed-in
         session — App.tsx renders <LoginPage /> for any unauthenticated
         request, so there is nothing else for a bot to index. Don't add
         per-route <head> tags to the private pages; they're unreachable. -->
    <meta name="robots" content="index, follow" />
    <meta name="description" content="LabOS is a research-grade lab operations platform for medical and life-sciences institutions — electronic lab notebook, sample biobanking, instrument scheduling, AI-assisted grant writing, IoT sensor monitoring, and 21 CFR Part 11 / GLP-aligned compliance in one system." />
    <meta name="author" content="LabOS" />
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LabOS" />
    <meta property="og:title" content="LabOS — Laboratory Operations & Research Management Platform" />
    <meta property="og:description" content="Centralize protocols, samples, instruments, grants, safety records, and team collaboration for your research lab — all in one secure platform." />
    <meta property="og:url" content="https://lab-os.vercel.app/" />
    <meta property="og:image" content="https://lab-os.vercel.app/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:locale" content="en_US" />
    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="LabOS — Laboratory Operations & Research Management Platform" />
    <meta name="twitter:description" content="Centralize protocols, samples, instruments, grants, safety records, and team collaboration for your research lab — all in one secure platform." />
    <meta name="twitter:image" content="https://lab-os.vercel.app/icon-512.png" />
    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "LabOS",
        "applicationCategory": "BusinessApplication",
        "applicationSubCategory": "Laboratory Information Management System",
        "operatingSystem": "Web",
        "url": "https://lab-os.vercel.app/",
        "description": "Research-grade lab operations platform: electronic lab notebook, sample biobanking, instrument scheduling, AI-assisted grant writing, IoT sensor monitoring, and compliance workflows aligned with 21 CFR Part 11 and GLP.",
        "offers": {
          "@type": "Offer",
          "category": "SaaS"
        }
      }
    </script>
    <!-- Mobile safe area support -->
    <style>
      /* Mobile-first base overrides */
      @media (max-width: 768px) {
        .sidebar { display: none !important; }
        .main-content { margin-left: 0 !important; padding-bottom: 80px !important; }
        .mobile-nav { display: flex !important; }
        .card { padding: 14px !important; }
        .page { padding: 12px !important; }
        h1 { font-size: 22px !important; }
        .fab { display: none !important; }
      }
      .mobile-nav {
        display: none;
        position: fixed;
        bottom: 0; left: 0; right: 0;
        background: var(--surface, #13293d);
        border-top: 1px solid var(--border, #2a4a67);
        z-index: 9999;
        padding: 8px 0;
        padding-bottom: env(safe-area-inset-bottom, 8px);
        justify-content: space-around;
        align-items: center;
      }
      .mobile-nav-item {
        display: flex; flex-direction: column; align-items: center;
        gap: 3px; padding: 4px 12px; cursor: pointer;
        color: var(--text-muted, #8fa3b8); font-size: 10px; font-weight: 500;
        border: none; background: none; border-radius: 8px; transition: color 0.15s;
      }
      .mobile-nav-item.active { color: var(--primary, #6366f1); }
      .mobile-nav-item .nav-icon { font-size: 22px; }
      /* Touch-friendly tap targets */
      @media (max-width: 768px) {
        button { min-height: 40px; }
        input, select, textarea { font-size: 16px !important; } /* Prevent iOS zoom */
        .btn { min-height: 44px; }
      }
      /* Safe area padding for notched phones */
      @supports (padding: max(0px)) {
        .mobile-nav { padding-bottom: max(8px, env(safe-area-inset-bottom)); }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
